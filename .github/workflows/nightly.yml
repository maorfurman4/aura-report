# The bots report: every night at 23:30 Israel time in winter (00:30 in summer), and on demand from the office.
# The morning run (07:30 / 08:30) builds and sends the report only if the night's run did not; a failed run alerts on Telegram.
# Supabase (pg_cron + the aura-watch function) starts these at the exact time, and the weekly summary on Sunday 08:00;
# GitHub's own cron below stays as a fallback (a day already built is skipped, so it never sends twice).
name: nightly report
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Rebuild this Israel day (YYYY-MM-DD); empty = before noon yesterday, after noon today'
        required: false
      weekly:
        description: 'Send the weekly summary (the week ending on that day) instead'
        type: boolean
        default: false
      scheduled:
        description: 'A scheduled run (from Supabase): skip a day already built'
        type: boolean
        default: false
      morning:
        description: 'The morning catch-up (from Supabase)'
        type: boolean
        default: false
concurrency: report
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test.mjs
      - if: inputs.weekly
        run: node weekly.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPORT_TELEGRAM_TOKEN: ${{ secrets.REPORT_TELEGRAM_TOKEN }}
          REPORT_TELEGRAM_CHAT: ${{ secrets.REPORT_TELEGRAM_CHAT }}
          REPORT_DAY: ${{ inputs.day }}
      - if: ${{ !inputs.weekly }}
        run: node report.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_TELEGRAM_TOKEN: ${{ secrets.REPORT_TELEGRAM_TOKEN }}
          REPORT_TELEGRAM_CHAT: ${{ secrets.REPORT_TELEGRAM_CHAT }}
          REPORT_DAY: ${{ inputs.day }}
          REPORT_SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '1' || '' }}
          REPORT_MORNING: ${{ (github.event.schedule == '30 5 * * *' || inputs.morning) && '1' || '' }}
      - if: failure()
        run: >-
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id="${CHAT}"
          --data-urlencode text="⚠️ דוח הבוטים נכשל ולא נשלח. הלוג: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TOKEN: ${{ secrets.REPORT_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.REPORT_TELEGRAM_CHAT }}
