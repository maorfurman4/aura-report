# The bots report: every night at 23:30 Israel time in winter (00:30 in summer), and on demand from the office.
name: nightly report
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Rebuild this Israel day (YYYY-MM-DD); empty = the day that is ending'
        required: false
concurrency: report
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test.mjs
      - run: node report.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_TELEGRAM_TOKEN: ${{ secrets.REPORT_TELEGRAM_TOKEN }}
          REPORT_TELEGRAM_CHAT: ${{ secrets.REPORT_TELEGRAM_CHAT }}
          REPORT_DAY: ${{ inputs.day }}
